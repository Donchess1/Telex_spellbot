{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spellbot 🎮</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #4b6cb7, #182848);
      color: #fff;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }    .game-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 450px;
      transition: opacity 0.4s ease-in-out;
      position: relative;
    }

    h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    .word { font-size: 2rem; letter-spacing: 10px; margin: 20px 0; }
    .status { margin: 15px 0; font-size: 1.1rem; color: #ffd633; }

    input[type="text"] {
      width: 60%;
      padding: 10px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      text-align: center;
    }    button {
      background-color: #ffcc00;
      color: #000;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease-in-out;
      margin-top: 15px;
    }

    button:hover { background-color: #ffd633; }
    
    button:disabled {
      background-color: #666;
      color: #999;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    input:disabled {
      background-color: #666;
      color: #999;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #playAgainBtn, #quitBtn {
      display: none;
      padding: 12px 18px;
      font-size: 1.1rem;
      margin: 10px 5px 0 5px;
    }

    #playAgainBtn { background-color: #00ff99; }
    #playAgainBtn:hover { background-color: #33ffaa; }

    #quitBtn { background-color: #ff4444; }
    #quitBtn:hover { background-color: #ff6666; }    .logout {
      display: inline-block;
      margin-top: 20px;
      color: #ffcc00;
      text-decoration: none;
      font-weight: bold;
    }
    .logout:hover { text-decoration: underline; }

    /* Score Meter Styles */
    .score-container {
      margin: 20px 0;
      text-align: center;
    }

    .score-label {
      font-size: 1.1rem;
      color: #ffd633;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .score-meter {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin: 10px 0;
    }

    .score-bar {
      width: 20px;
      height: 25px;
      background-color: #333;
      border: 2px solid #555;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .score-bar.filled {
      background-color: #00ff99;
      border-color: #00cc77;
      box-shadow: 0 0 8px #00ff99;
    }

    .score-bar.high {
      background-color: #00ff99;
      border-color: #00cc77;
    }

    .score-bar.medium {
      background-color: #ffcc00;
      border-color: #cc9900;
    }    .score-bar.low {
      background-color: #ff4444;
      border-color: #cc3333;
    }

    /* Lives and Wins Indicators */
    .lives-container {
      position: absolute;
      top: 10px;
      right: 15px;
      text-align: center;
    }

    .wins-container {
      position: absolute;
      top: 10px;
      left: 15px;
      text-align: center;
    }

    .indicator-label {
      font-size: 0.9rem;
      color: #ffd633;
      margin-bottom: 5px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .indicator-balls {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .indicator-ball {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #00ff99;
      border: 1px solid #00cc77;
      box-shadow: 0 0 6px #00ff99;
      transition: all 0.3s ease;
    }

    .indicator-ball.dimmed {
      background-color: #333;
      border-color: #555;
      box-shadow: none;
      opacity: 0.4;
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 480px) {
      .lives-container, .wins-container {
        position: static;
        margin: 10px 0;
      }
      
      .game-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>  <div class="game-container" id="gameContainer">
    <!-- Lives indicator (upper right) -->
    <div class="lives-container">
      <div class="indicator-label">Lives</div>
      <div class="indicator-balls" id="livesDisplay">
        <div class="indicator-ball" data-life="0"></div>
        <div class="indicator-ball" data-life="1"></div>
        <div class="indicator-ball" data-life="2"></div>
        <div class="indicator-ball" data-life="3"></div>
        <div class="indicator-ball" data-life="4"></div>
        <div class="indicator-ball" data-life="5"></div>
      </div>
    </div>    <!-- Skill Level indicator (upper left) -->
    <div class="wins-container">
      <div class="indicator-label">Skill</div>
      <div class="indicator-balls" id="skillDisplay">
        <div class="indicator-ball" data-skill="0"></div>
        <div class="indicator-ball" data-skill="1"></div>
        <div class="indicator-ball" data-skill="2"></div>
        <div class="indicator-ball" data-skill="3"></div>
        <div class="indicator-ball" data-skill="4"></div>
        <div class="indicator-ball" data-skill="5"></div>
        <div class="indicator-ball" data-skill="6"></div>
        <div class="indicator-ball" data-skill="7"></div>
        <div class="indicator-ball" data-skill="8"></div>
        <div class="indicator-ball" data-skill="9"></div>
      </div>
    </div>    <h1>🎯 Spellbot</h1>
    <p>Welcome, <b>{{ username }}</b>!</p>

    <div class="word" id="wordDisplay">_ _ _ _ _ _</div>
    <div id="gameMessage"></div>

    <div id="inputArea">
      <input type="text" id="guessInput" maxlength="10" placeholder="Enter letter" autofocus>
      <button id="sendGuess">Send</button>
    </div>

    <div id="result"></div>

    <!-- During game, replace logout with quit -->
    <a href="{% url 'logout' %}" class="logout" id="logoutLink">Logout</a>

    <!-- Buttons shown after game ends -->
    <div id="endGameButtons">
      <button id="playAgainBtn">We Go Again</button>
      <button id="quitBtn">I Quit</button>
    </div>
  </div>

  <script>    const sendBtn = document.getElementById("sendGuess");
    const guessInput = document.getElementById("guessInput");
    const inputArea = document.getElementById("inputArea");
    const gameMessage = document.getElementById("gameMessage");
    const wordDisplay = document.getElementById("wordDisplay");
    const result = document.getElementById("result");const csrftoken = document.querySelector('[name=csrf-token]').content;
    const playAgainBtn = document.getElementById("playAgainBtn");
    const quitBtn = document.getElementById("quitBtn");
    const logoutLink = document.getElementById("logoutLink");
    const livesDisplay = document.getElementById("livesDisplay");
    const skillDisplay = document.getElementById("skillDisplay");

    // Function to update lives display
    function updateLivesDisplay(livesLeft) {
      const lifeBalls = livesDisplay.querySelectorAll('.indicator-ball');
      lifeBalls.forEach((ball, index) => {
        if (index < livesLeft) {
          ball.classList.remove('dimmed');
        } else {
          ball.classList.add('dimmed');
        }
      });
    }

    // Function to update skill display with color coding
    function updateSkillDisplay(skillLevel) {
      const skillBalls = skillDisplay.querySelectorAll('.indicator-ball');
      skillBalls.forEach((ball, index) => {
        if (index < skillLevel) {
          ball.classList.remove('dimmed');
          // Add color coding based on skill level
          if (skillLevel >= 8) {
            ball.style.backgroundColor = '#00ff99';
            ball.style.borderColor = '#00cc77';
            ball.style.boxShadow = '0 0 6px #00ff99';
          } else if (skillLevel >= 4) {
            ball.style.backgroundColor = '#ffcc00';
            ball.style.borderColor = '#cc9900';
            ball.style.boxShadow = '0 0 6px #ffcc00';
          } else {
            ball.style.backgroundColor = '#ff4444';
            ball.style.borderColor = '#cc3333';
            ball.style.boxShadow = '0 0 6px #ff4444';
          }
        } else {
          ball.classList.add('dimmed');
        }
      });
    }

    // 🔹 Auto-start game when page loads
    window.addEventListener("load", async () => {
      await startGame();
    });    async function startGame() {
      // Reset UI and show loading state
      wordDisplay.textContent = "_ _ _ _ _ _";
      gameMessage.textContent = "🎮 Loading new word... ⏳";
      result.textContent = "";
      guessInput.value = "";
      
      // Disable input during loading
      sendBtn.disabled = true;
      guessInput.disabled = true;

      inputArea.style.display = "block";
      logoutLink.style.display = "none"; // hide logout, show quit
      playAgainBtn.style.display = "none";
      quitBtn.style.display = "inline-block";

      try {
        const response = await fetch("{% url 'hangman_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify({ message: "auto_start" })
        });

        const data = await response.json();        if (data.new_hidden_word)
          wordDisplay.textContent = data.new_hidden_word.split("").join(" ");
        if (data.attempts_left !== undefined) {
          updateLivesDisplay(data.attempts_left);
        }
        if (data.current_score !== undefined)
          updateSkillDisplay(data.current_score);
        gameMessage.textContent = data.message || "Make your first guess!";
        
        // Re-enable input after loading
        sendBtn.disabled = false;
        guessInput.disabled = false;
        guessInput.focus(); // Focus on input for immediate play
      } catch (err) {
        gameMessage.textContent = "⚠️ Error connecting to server.";
        console.error(err);
        // Re-enable input even on error
        sendBtn.disabled = false;
        guessInput.disabled = false;
      }
    }    async function sendGuess() {
      const message = guessInput.value.trim();
      if (!message) {
        gameMessage.textContent = "⚠️ Please enter a letter.";
        return;
      }

      // Show processing state
      const originalMessage = gameMessage.textContent;
      gameMessage.textContent = "🤔 Checking your guess...";
      sendBtn.disabled = true;
      guessInput.disabled = true;

      guessInput.value = "";
      result.textContent = "";

      try {
        const response = await fetch("{% url 'hangman_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();        if (data.new_hidden_word)
          wordDisplay.textContent = data.new_hidden_word.split("").join(" ");
        if (data.attempts_left !== undefined) {
          updateLivesDisplay(data.attempts_left);
        }
        if (data.current_score !== undefined)
          updateSkillDisplay(data.current_score);
        if (data.message)
          gameMessage.textContent = data.message;

        // 🔚 Show buttons when game ends, hide input & quit
        if (data.game_over) {
          inputArea.style.display = "none";
          logoutLink.style.display = "none";
          playAgainBtn.style.display = "inline-block";
          quitBtn.style.display = "inline-block";
        } else {
          // Re-enable input for next guess
          sendBtn.disabled = false;
          guessInput.disabled = false;
          guessInput.focus();
        }
      } catch (err) {
        gameMessage.textContent = "⚠️ Error connecting to server.";
        console.error(err);
        // Re-enable input on error
        sendBtn.disabled = false;
        guessInput.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendGuess);
    guessInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendGuess();
      }
    });    // 🔁 Replay logic - Force start a new game
    playAgainBtn.addEventListener("click", async () => {
      try {
        const response = await fetch("{% url 'hangman_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify({ message: "force_new_game" })
        });

        const data = await response.json();
        
        if (data.new_hidden_word)
          wordDisplay.textContent = data.new_hidden_word.split("").join(" ");
        if (data.attempts_left !== undefined) {
          updateLivesDisplay(data.attempts_left);
        }
        if (data.current_score !== undefined)
          updateSkillDisplay(data.current_score);
        gameMessage.textContent = data.message || "New game started!";
        
        // Reset game UI
        inputArea.style.display = "block";
        logoutLink.style.display = "none";
        playAgainBtn.style.display = "none";
        quitBtn.style.display = "inline-block";
        result.textContent = "";
        
        // Enable input
        sendBtn.disabled = false;
        guessInput.disabled = false;
        guessInput.focus();
      } catch (err) {
        gameMessage.textContent = "⚠️ Error starting new game.";
        console.error(err);
      }
    });

    // ❌ Quit logic — redirect to login page
    quitBtn.addEventListener("click", () => {
      window.location.href = "{% url 'login' %}";
    });
  </script>
</body>
</html>
